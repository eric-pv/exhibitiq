# D2-05 — 手動或排程執行來源擷取／匯入，把證據放進「資料更新 PR」。
#
# 安全設計（總規範 §4）：
#   * 預設不給任何權限（permissions: {}）；只有 crawl 工作有 contents: write 與 pull-requests: write。
#   * 永遠不寫入 main：資料推到 data/crawl-* 分支，再開 PR 到 dev/data-platform，由資料工程同事（Albert）自行審閱與合併。
#   * 輸入一律經 env 傳入，不插入 shell 指令；來源名稱、續跑 ID 由 crawler.cli 驗證。
#   * 沒有任何密鑰；擷取程式不使用憑證。
#   * 同一來源同時只會跑一個（concurrency），工作有逾時。
# 排程只執行 crawler/schedule.toml 列出的來源（預設為空 = 什麼都不抓）。
name: crawl

on:
  workflow_dispatch:
    inputs:
      source:
        description: "來源設定名稱（crawler/sources/<名稱>.toml 的檔名，不含 .toml）"
        required: true
        type: string
      max_requests:
        description: "最多抓取的頁面數（1–5000）"
        required: false
        default: "500"
        type: string
      resume_run:
        description: "續跑：先前那次執行的 ID（run_…），只抓它未完成或暫時失敗的網址；留空表示全新執行"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

env:
  DATA_BRANCH: dev/data-platform

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python -c 'import json,os; print("sources=" + json.dumps([os.environ["SOURCE"]]))' >> "$GITHUB_OUTPUT"
          else
            echo "sources=$(python -m crawler.cli scheduled)" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    concurrency:
      group: crawl-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: run
        env:
          SOURCE: ${{ matrix.source }}
          MAX_REQUESTS: ${{ inputs.max_requests || '500' }}
          RESUME_RUN: ${{ inputs.resume_run }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          set -euo pipefail
          args=(run --source "$SOURCE" --max-requests "$MAX_REQUESTS" --trigger "$TRIGGER")
          if [ -n "$RESUME_RUN" ]; then args+=(--resume "$RESUME_RUN"); fi
          python -m crawler.cli "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      - name: Open a data-update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
          RUN_DIR: ${{ steps.run.outputs.run_dir }}
          RUN_ID: ${{ steps.run.outputs.crawl_run_id }}
          STATUS: ${{ steps.run.outputs.status }}
          SNAPSHOTS: ${{ steps.run.outputs.snapshots }}
          ERRORS: ${{ steps.run.outputs.errors }}
          PENDING: ${{ steps.run.outputs.pending }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="data/crawl-${SOURCE}-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- "$RUN_DIR"
          git commit -m "[crawl] ${SOURCE}: ${RUN_ID} (${STATUS})"
          git push origin "$branch"
          {
            echo "> ⚠️ **合併人：Albert。Eric 請勿合併。**"
            echo
            echo "資料更新（自動產生）：來源 \`${SOURCE}\`，執行 \`${RUN_ID}\`，狀態 **${STATUS}**。"
            echo
            echo "- 快照：${SNAPSHOTS}　錯誤：${ERRORS}　未抓取（可續跑）：${PENDING}"
            echo "- 目錄：\`${RUN_DIR}\`"
            echo "- Workflow 執行：${RUN_URL}"
            echo
            echo "狀態為 failed／partial 也會提交：失敗是資料，請看 \`errors.json\` 與 \`crawl_run.json\`。合併前請確認內容合法且不含不該公開的資料。"
          } > body.md
          gh pr create --base "$DATA_BRANCH" --head "$branch" \
            --title "【Albert 合併】[crawl:${SOURCE}] ${RUN_ID} (${STATUS})" \
            --body-file body.md --assignee acyihung-infinityandbeyond
